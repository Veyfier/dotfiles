# Hyprland — личный конфиг Veyfier
# Документация по опциям: https://wiki.hyprland.org/Configuring/Variables/

# --- Монитор ---
monitor = ,preferred,auto,1

# --- Автозапуск ---
exec-once = waybar
exec-once = swww-daemon
exec-once = sleep 1 && swww img ~/bg.jpg --transition-type any
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# --- Ввод (клавиатура и мышь) ---
# Раскладки переключаются по Ctrl+Space.
# Если привычнее Alt+Shift — замените на: kb_options = grp:alt_shift_toggle
input {
    kb_layout = us,ru
    kb_options = grp:ctrl_space_toggle
    follow_mouse = 1
    sensitivity = 0 # -1.0 .. 1.0, 0 — без изменений
}

# --- Внешний вид ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(ffffff)
    col.inactive_border = rgb(444444)
    layout = dwindle
    allow_tearing = true
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# --- Анимации ---
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# --- Приложения ---
$mainMod = SUPER

bind = $mainMod, Q, exec, kitty
bind = $mainMod, E, exec, dolphin
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, M, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, C, killactive

# Перезапуск waybar после правки конфига
bind = $mainMod SHIFT, R, exec, killall waybar; waybar > /dev/null 2>&1 & disown

# --- Медиа-клавиши ---
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# --- Окна мышкой ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Скриншоты ---
# Область в буфер обмена (Ctrl + ;)
bind = CTRL, semicolon, exec, grim -g "$(slurp)" - | wl-copy
# Весь экран в буфер обмена (Ctrl + Alt + ;)
bind = CTRL ALT, semicolon, exec, grim - | wl-copy
# Область с сохранением в файл (Win + Shift + S)
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" ~/Pictures/$(date +'%Y-%m-%d-%H%M%S_screenshot.png') && notify-send "Скриншот сохранен"

# --- Рабочие столы ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# --- Перемещение окна на другой рабочий стол ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# --- Правила окон ---
# Синтаксис windowrule менялся между версиями Hyprland.
# Если правила не применяются — проверьте формат под вашу версию.
windowrule = no_focus 1, match:class ^(waybar)$
windowrule = no_initial_focus 1, match:class ^(waybar)$

# Разрешить tearing для игр (раскомментируйте при необходимости)
# windowrule = immediate 1, match:class ^(minecraft)$
# windowrule = immediate 1, match:class ^(PrismLauncher)$
# windowrule = immediate 1, match:class ^(org.prismlauncher.PrismLauncher)$
